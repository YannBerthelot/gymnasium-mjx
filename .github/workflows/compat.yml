name: Compatibility

# The declared dependency floors and the newest releases (RELEASING.md,
# "between releases"): weekly, and when the dependencies change.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [pyproject.toml, uv.lock]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The floors' run took 25-44 minutes (MuJoCo 3.7 compiles slower).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        resolution: [highest, lowest-direct]
    env:
      JAX_PLATFORMS: cpu
      # JAX's persistent compilation cache, kept between runs: compiling the
      # MuJoCo models is most of the suite's time (3-5x more at jax 0.5).
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax_cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
      JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "-1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/cache@v4
        with:
          path: .jax_cache
          key: jax-cache-${{ matrix.resolution }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: jax-cache-${{ matrix.resolution }}-
      - run: uv sync --upgrade --resolution ${{ matrix.resolution }} --python 3.12
      - run: uv run --no-sync pytest -n auto
